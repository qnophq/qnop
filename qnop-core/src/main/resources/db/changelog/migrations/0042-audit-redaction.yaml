#
# Erasure of users the audit trail names (issue #952, ADR-0043 amendment):
# deleting a user pseudonymises every audit row that references them through a
# single sanctioned redaction path that keeps the hash chain linked and records
# itself as an `audit.chain.redacted` event. A NEW changeset — shipped
# changesets are immutable. The body lives in a sqlFile (PL/pgSQL needs
# splitStatements: false).
databaseChangeLog:
  - changeSet:
      id: 0042-audit-redaction
      author: qnop
      comment: >-
        audit_event redaction columns, redaction-aware seal and guards, and the
        user-deletion trigger that pseudonymises the audit trail (issue #952).
      changes:
        - sqlFile:
            path: 0042-audit-redaction.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sqlFile:
            path: 0042-audit-redaction-rollback.sql
            relativeToChangelogFile: true
            splitStatements: false
