# Public team profile visibility (issue #586): two per-team toggles controlling
# what the workspace-public profile page exposes to NON-members — the roster
# and the review participation. Conservative defaults (both hidden): exposing
# is an explicit lead/admin decision. Additive (post-1.0.0 rule).
databaseChangeLog:
  - changeSet:
      id: 0025-team-profile-visibility
      author: qnop
      comment: Adds the public-profile visibility toggles to team (issue #586).
      changes:
        - addColumn:
            tableName: team
            columns:
              - column:
                  name: profile_show_members
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: profile_show_reviews
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
