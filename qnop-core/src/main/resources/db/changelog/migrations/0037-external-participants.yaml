# Account-less review participants (issue #684, ADR-0061): a participant may be
# identified by something other than a user id — the row's own id becomes the
# guest's principal id. A NEW changeset, never a change to 0011: qnop has
# released versions, so shipped changesets are immutable (checksum-validated on
# every deployed instance).
databaseChangeLog:
  - changeSet:
      id: 0037-external-participants
      author: qnop
      comment: >-
        review_participant.external_display_name + three-way principal XOR;
        review_visit.user_id becomes a principal id (user FK dropped).
      changes:
        - addColumn:
            tableName: review_participant
            columns:
              # Set exactly when user_id and team_id are both null; the row's id is
              # then the participant's principal id (ADR-0061).
              - column: { name: external_display_name, type: 'VARCHAR(120)' }
        - sql:
            comment: >-
              Widen the principal XOR to user/team/external (issue #684); CHECK
              constraints have no typed Liquibase change, so drop+add ride SQL.
            splitStatements: true
            sql: |
              ALTER TABLE review_participant DROP CONSTRAINT ck_review_participant_principal;
              ALTER TABLE review_participant ADD CONSTRAINT ck_review_participant_principal
                CHECK (num_nonnulls(user_id, team_id, external_display_name) = 1);
        # No FK on review_visit.user_id any more: the column holds a PRINCIPAL id — usually a
        # user id, but an external participant's row id for account-less visitors. Accepted
        # consequence: visit rows of hard-deleted users (or removed guests) orphan quietly —
        # they are inert (readers join names by id and skip unknowns) and cascade away with
        # the document.
        - dropForeignKeyConstraint:
            baseTableName: review_visit
            constraintName: fk_review_visit_user
