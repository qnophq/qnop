#
# Server-rendered mail phrases (issue #853), English. This root bundle is the
# English catalog and the fallback for every other language: a key missing from
# messages_<locale>.properties resolves here. Read as UTF-8.
#
# Every value must stay byte-identical to the literal it replaced, so English
# mail does not change. Translations live beside it as messages_<locale>.properties
# and must define every key (MailMessagesTest checks the parity).
#
# Formatting follows Spring's MessageSource convention: a value is run through
# java.text.MessageFormat ONLY when the caller passes arguments. Values used with
# arguments must therefore double a literal apostrophe ('') — values without
# arguments are taken verbatim.
#
# Counted phrases (MailMessages.count) receive two arguments: {0} is the number
# that selects the plural form in a choice format, {1} the same number as plain
# digits to print — so a count never gains a grouping separator ("1234", not
# "1,234"), whatever the language.

# The shared layout (EmailLayoutBuilder / MailTemplateService)
layout.footer=This is an automated message — please don't reply.
layout.cta.fallback=Open
layout.cta.linkHint=Button not working? Paste this link into your browser:

# RelativeTimePhrase — the {{expiresAtHuman}} variable
time.in.minutes={0,choice,1#in 1 minute|1<in {1} minutes}
time.in.hours={0,choice,1#in 1 hour|1<in {1} hours}
time.in.days={0,choice,1#in 1 day|1<in {1} days}

# The {{decision}} variable of review.annotation_decided — a past participle that
# reads in "{{actorName}} {{decision}} an annotation" and "was {{decision}}".
decision.resolved=resolved
decision.dismissed=dismissed
decision.reopened=reopened

# Workflow states in the {{oldState}}/{{newState}} variables
workflow.DRAFT=Draft
workflow.IN_REVIEW=In review
workflow.CHANGES_REQUESTED=Changes requested
workflow.FINALIZED=Finalized
workflow.CANCELLED=Cancelled

# Actor names when the real one cannot be shown
actor.participant=A participant
actor.system=System
actor.administrator=An administrator
actor.owner=The owner

# The daily digest (DigestRenderer)
digest.total={0,choice,0#{1} updates|1#{1} update|1<{1} updates}
digest.count.ANNOTATION_CREATED={0,choice,0#{1} new annotations|1#{1} new annotation|1<{1} new annotations}
digest.count.COMMENT_ADDED={0,choice,0#{1} comments|1#{1} comment|1<{1} comments}
digest.count.ANNOTATION_DECIDED={0,choice,0#{1} decisions|1#{1} decision|1<{1} decisions}
digest.count.VERSION_UPLOADED={0,choice,0#{1} new versions|1#{1} new version|1<{1} new versions}
digest.count.WORKFLOW_CHANGED={0,choice,0#{1} status changes|1#{1} status change|1<{1} status changes}
digest.count.PARTICIPANT_ADDED={0,choice,0#{1} new participants|1#{1} new participant|1<{1} new participants}
digest.count.REVIEW_DELETED={0,choice,0#{1} deleted reviews|1#{1} deleted review|1<{1} deleted reviews}
digest.count.MENTION={0,choice,0#{1} mentions|1#{1} mention|1<{1} mentions}
digest.event.ANNOTATION_CREATED={0} raised an annotation
digest.event.COMMENT_ADDED={0} replied in a thread
digest.event.ANNOTATION_DECIDED={0} decided an annotation
digest.event.VERSION_UPLOADED={0} uploaded a new version
digest.event.VERSION_UPLOADED.numbered={0} uploaded a new version (v{1})
digest.event.WORKFLOW_CHANGED={0} changed the review status
digest.event.PARTICIPANT_ADDED={0} added you to the review
digest.event.REVIEW_DELETED={0} deleted the review
digest.event.MENTION={0} mentioned you
digest.target.workspace=Your workspace
digest.target.unknownReview=A review you take part in
# A java.time DateTimeFormatter pattern, formatted in the bundle's language.
digest.time.pattern=MMM d, HH:mm
