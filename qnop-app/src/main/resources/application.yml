#
# Base application config for the qnop Community server (ADR-0020).
# All qnop environment variables are QNOP_-prefixed (see .env.example);
# docker-compose maps the same QNOP_DB_* onto the image-mandated POSTGRES_*, so a
# single .env drives both the DB container and the app. Defaults target the local
# docker-compose Postgres; production may override with the standard
# SPRING_DATASOURCE_* keys.
# Logging (issue #659, ADR-0054). Two things are configured here and nothing else
# is: what identifies a line, and in which shape it is written.
#
# `pattern.correlation` is the slot Boot's default console pattern already leaves
# for diagnostic context, so the rest of the layout stays Boot's. Without it the
# MDC would be populated and invisible — the default pattern prints none of it.
# Blank values render as empty fields, which is why the keys are the three that
# earn their width on every line; method and path are in the MDC for structured
# output but not in the console layout, where the message usually names them.
#
# `structured.format.console` is empty by default, i.e. human-readable text for a
# developer at a terminal. Set QNOP_LOG_FORMAT=ecs (or logstash / gelf) in a
# deployment and every line becomes one JSON object with the MDC as fields — the
# form a log aggregator can actually query. Boot ships this; no encoder library.
logging:
  pattern:
    # Not env-overridable on purpose: the value contains ':' inside %X{...},
    # which Spring's placeholder syntax would read as a default separator.
    correlation: "[%X{requestId:-} %X{userId:-} %X{documentId:-}] "
  structured:
    format:
      console: ${QNOP_LOG_FORMAT:}
  level:
    # The application's own packages speak at INFO; everything below is Boot's
    # default. Raise one package with QNOP_LOG_LEVEL_QNOP=DEBUG when chasing a
    # specific failure rather than turning up the whole tree.
    io.qnop: ${QNOP_LOG_LEVEL_QNOP:INFO}

    # Verbose method tracing of the service layer: entry with the call's ids, exit
    # with the result's shape and duration (MethodTraceAspect). Its own switch, so
    # DEBUG here does not also turn the rest of io.qnop to DEBUG — and OFF here
    # keeps the traffic down when io.qnop is at DEBUG for one specific hunt.
    # A single class: QNOP_LOG_LEVEL_TRACE stays INFO and set
    # logging.level.io.qnop.trace.ReviewService=DEBUG instead.
    io.qnop.trace: ${QNOP_LOG_LEVEL_TRACE:INFO}

    # The layers below the application, each off unless asked for. They are noisy by
    # design — one request can be dozens of statements — which is why none of them is
    # tied to the switch above.
    org.hibernate.SQL: ${QNOP_LOG_SQL:INFO}
    org.springframework.security: ${QNOP_LOG_LEVEL_SECURITY:INFO}
    org.springframework.web: ${QNOP_LOG_LEVEL_WEB:INFO}
    org.springframework.transaction: ${QNOP_LOG_LEVEL_TX:INFO}

spring:
  lifecycle:
    # Upper bound for the graceful-shutdown drain (issue #495).
    timeout-per-shutdown-phase: ${QNOP_HTTP_SHUTDOWN_GRACE:30s}
  application:
    name: qnop
  jackson:
    datatype:
      datetime:
        # Timestamp L10n policy (issue #465, ADR-0041): every java.time value serializes as an
        # ISO-8601 string with an explicit offset (Instant → ...Z), never epoch millis. This is
        # the Jackson 3 default, pinned here so a future dependency bump cannot silently flip it.
        # In Jackson 3 WRITE_DATES_AS_TIMESTAMPS is a DateTimeFeature (not SerializationFeature),
        # bound by Spring Boot 4 under spring.jackson.datatype.datetime; the key must be the exact
        # enum constant (relaxed kebab-case binding does not apply to tools.jackson enum keys).
        WRITE_DATES_AS_TIMESTAMPS: false
  datasource:
    url: jdbc:postgresql://${QNOP_DB_HOST:localhost}:${QNOP_DB_PORT:5432}/${QNOP_DB_NAME:qnop}
    username: ${QNOP_DB_USERNAME:qnop}
    password: ${QNOP_DB_PASSWORD:qnop}
  jpa:
    # Liquibase owns the schema; Hibernate never alters it.
    hibernate:
      ddl-auto: none
    open-in-view: false
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml
  servlet:
    multipart:
      # Headroom over the largest service-level cap — the document upload setting
      # (upload.document_max_file_size_mb, default 25 MB; issue #245) — so the size checks in
      # AvatarService/BrandingService/DocumentIngestService return a clean 413 before
      # the container rejects the request. Operators raising the document setting past
      # this ceiling must raise QNOP_UPLOAD_MULTIPART_LIMIT_MB with it. Multipart
      # uploads stream to a temp file, not the heap, so a generous ceiling is safe.
      max-file-size: ${QNOP_UPLOAD_MULTIPART_LIMIT_MB:55}MB
      max-request-size: ${QNOP_UPLOAD_MULTIPART_LIMIT_MB:55}MB
  mvc:
    async:
      # Cap async request handling so a stalled async dispatch cannot pin request
      # resources indefinitely (issue #342).
      request-timeout: ${QNOP_HTTP_REQUEST_TIMEOUT:30s}

# Inbound request timeouts (issue #342): bound how long the connector waits on a
# slow/stalled client so a worker thread is never held open forever.
server:
  # Drain in-flight requests on SIGTERM (container stops, rolling deploys)
  # before the JVM exits (issue #495).
  shutdown: graceful
  # Behind a trusted reverse proxy set QNOP_HTTP_FORWARD_HEADERS_STRATEGY=framework
  # so X-Forwarded-* drive scheme/host (Secure cookies, redirect URLs).
  forward-headers-strategy: ${QNOP_HTTP_FORWARD_HEADERS_STRATEGY:none}
  tomcat:
    connection-timeout: ${QNOP_HTTP_CONNECTION_TIMEOUT:20s}
    # Reap idle keep-alive connections rather than holding a thread per socket.
    keep-alive-timeout: ${QNOP_HTTP_KEEP_ALIVE_TIMEOUT:20s}

management:
  endpoints:
    web:
      exposure:
        # health is public (probes); prometheus is admin-only (SecurityConfiguration), scraped by
        # an ops Prometheus with an admin token (issue #348, ADR-0013).
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      # Anonymous callers (k8s probes) see only UP/DOWN; the job-queue counts and staleness
      # details are revealed only to an authenticated admin.
      show-details: when_authorized

# Security & crypto foundation (issue #10, ADR-0022). Secrets come from the
# QNOP_AUTH_* environment namespace — no secure default is baked in; the
# placeholder below trips @ValidSecret so a deployment that forgot to set real
# values refuses to start. CORS origins gate SPA / front-end access.
qnop:
  auth:
    jwt-secret: ${QNOP_AUTH_JWT_SECRET:CHANGE_ME}
    encryption-key: ${QNOP_AUTH_ENCRYPTION_KEY:CHANGE_ME}
    encryption-salt: ${QNOP_AUTH_ENCRYPTION_SALT:CHANGE_ME}
    # OIDC discovery against a private/loopback issuer (e.g. a local Keycloak on
    # http://localhost) is blocked by default as an SSRF guard (issue #21). The
    # local-dev .env turns this on so the bundled Keycloak works out of the box.
    # NEVER enable in production.
    oidc:
      allow-private-discovery-uris: ${QNOP_AUTH_OIDC_ALLOW_PRIVATE_DISCOVERY_URIS:false}
      # Post-OIDC-login redirect base (issue #178). Blank → same-origin relative redirects
      # (SPA served from the API origin). Set to the SPA's absolute origin when hosted
      # separately. Independent of CORS allowed-origins.
      frontend-base-url: ${QNOP_AUTH_OIDC_FRONTEND_BASE_URL:}
  cors:
    allowed-origins: ${QNOP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  # Outbound HTTP timeouts (issue #342). `outbound-*` bound the GitHub email fetch
  # (OIDC login) and, as JDK HttpURLConnection defaults, the OIDC issuer discovery
  # and JWK-set fetches; `smtp-*` bound the outgoing-mail transport. All are
  # durations (e.g. 5s, 500ms, PT2S) and overridable via the QNOP_HTTP_CLIENT_* env.
  http-client:
    outbound-connect-timeout: ${QNOP_HTTP_CLIENT_OUTBOUND_CONNECT_TIMEOUT:5s}
    outbound-read-timeout: ${QNOP_HTTP_CLIENT_OUTBOUND_READ_TIMEOUT:15s}
    smtp-connect-timeout: ${QNOP_HTTP_CLIENT_SMTP_CONNECT_TIMEOUT:10s}
    smtp-read-timeout: ${QNOP_HTTP_CLIENT_SMTP_READ_TIMEOUT:30s}
    smtp-write-timeout: ${QNOP_HTTP_CLIENT_SMTP_WRITE_TIMEOUT:30s}
  # Re-anchoring cascade tunables (ADR-0009, issue #320). Advanced; the conservative
  # defaults live in ReanchoringProperties. Override per key via QNOP_REANCHORING_*:
  #   *_SIMILARITY_THRESHOLD (0.75), *_AMBIGUITY_MARGIN (0.05), *_CONTEXT_LENGTH (32),
  #   *_MAX_CANDIDATES (64), *_QUOTE_WEIGHT (0.7), *_CONTEXT_WEIGHT (0.3)
  # Object storage for binary documents (issue #243, ADR-0005). Defaults target the
  # docker-compose MinIO; leave `endpoint` blank to target real AWS S3 (SaaS). The
  # access/secret keys are storage credentials, not crypto secrets, so short local
  # MinIO values are fine. `auto-create-bucket` is on for local dev / an empty MinIO;
  # real S3 buckets are pre-provisioned, so set it false in production.
  s3:
    endpoint: ${QNOP_S3_ENDPOINT:}
    region: ${QNOP_S3_REGION:us-east-1}
    bucket: ${QNOP_S3_BUCKET:qnop-documents}
    access-key: ${QNOP_S3_ACCESS_KEY:qnop}
    secret-key: ${QNOP_S3_SECRET_KEY:qnop_secret}
    path-style-access: ${QNOP_S3_PATH_STYLE_ACCESS:true}
    auto-create-bucket: ${QNOP_S3_AUTO_CREATE_BUCKET:false}
    reaper-grace-period: ${QNOP_S3_REAPER_GRACE_PERIOD:PT1H}
    reaper-cron: ${QNOP_S3_REAPER_CRON:0 30 3 * * *}
  # The out-of-process office converter (issues #639/#343, ADR-0007/0010/0055) — it
  # turns DOCX uploads into the PDF a review is read on, and renders the annotation
  # export to PDF. `binary` is resolved on PATH; leave it unless the suite lives
  # somewhere unusual. A deployment without it simply offers neither, which
  # `GET /api/v1/config` reports.
  #
  # `max-concurrent` bounds how many conversions run at once *on this instance*:
  # each is a cold-started office suite with that much memory, so the useful number
  # is small, and it is not a per-deployment limit (ADR-0055). A conversion that
  # finds every slot busy waits up to `max-wait` and is then refused — the export
  # answers 503 with Retry-After, an ingest job retries under the queue's backoff.
  # Instance quotas (issue #673, ADR-0057). What this deployment may hold, set by
  # whoever operates it — a SaaS plan, in practice. Deliberately NOT application
  # settings: an administrator inside the instance must not be able to raise their
  # own ceiling, and anything in the settings registry appears in a web form.
  #
  # 0 means unlimited, so a Community deployment is unaffected. Limits bound what
  # is created and never invalidate what exists: lowering one below current usage
  # refuses the next record and leaves every present one alone. `max-team-members`
  # applies per team; `max-active-reviews` counts DRAFT, IN_REVIEW and
  # CHANGES_REQUESTED — finished work occupies no seat.
  limits:
    max-users: ${QNOP_LIMITS_MAX_USERS:0}
    max-teams: ${QNOP_LIMITS_MAX_TEAMS:0}
    max-team-members: ${QNOP_LIMITS_MAX_TEAM_MEMBERS:0}
    max-active-reviews: ${QNOP_LIMITS_MAX_ACTIVE_REVIEWS:0}
  # Capabilities this deployment offers at all (issue #674, ADR-0057). Same place
  # and same reasoning as the quotas above: what the operator granted, not what
  # the tenant chose. All default to true, so a Community deployment has
  # everything.
  #
  # Switching one off closes the door rather than hiding the handle: with
  # `oidc: false` the OAuth2 endpoints are not mounted at all, with
  # `annotation-export: false` the export endpoint refuses as well as vanishing
  # from the format list, and with `custom-branding: false` every slot serves the
  # bundled logo even where an upload is stored — otherwise a downgrade would
  # leave the previous branding on screen.
  features:
    oidc: ${QNOP_FEATURES_OIDC:true}
    annotation-export: ${QNOP_FEATURES_ANNOTATION_EXPORT:true}
    custom-branding: ${QNOP_FEATURES_CUSTOM_BRANDING:true}
  # Usage tracking (issue #666). What an operator configures lives in the admin
  # settings (provider, host, site id, consent, opt-outs); the two keys here are
  # deployment decisions that must not be reachable from the web UI.
  #
  # `allow-private-host` lets the proxy call a private/loopback address — a
  # self-hosted Matomo on an internal network is the normal case, but so is
  # 169.254.169.254, which is why this is a property and not a setting.
  tracking:
    allow-private-host: ${QNOP_TRACKING_ALLOW_PRIVATE_HOST:false}
    rate-limit:
      max-attempts: ${QNOP_TRACKING_RATE_LIMIT_MAX_ATTEMPTS:120}
      window-seconds: ${QNOP_TRACKING_RATE_LIMIT_WINDOW_SECONDS:60}
  office:
    binary: ${QNOP_OFFICE_BINARY:soffice}
    timeout: ${QNOP_OFFICE_TIMEOUT:60s}
    max-concurrent: ${QNOP_OFFICE_MAX_CONCURRENT:2}
    max-wait: ${QNOP_OFFICE_MAX_WAIT:30s}
