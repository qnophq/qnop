#
# Points Grafana at the Prometheus of docker-compose.observability.yml (issue #962).
apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      # The scrape interval of prometheus.yml: Grafana sizes $__rate_interval from it.
      timeInterval: 30s
