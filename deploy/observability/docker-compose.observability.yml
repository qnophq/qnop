#
# Prometheus and Grafana beside a qnop deployment (issue #962, docs/OBSERVABILITY.md).
#
# An overlay, not a stack of its own. From the deploy/ directory:
#
#   docker compose -f docker-compose.yml -f observability/docker-compose.observability.yml up -d
#
# It gives qnop a management port (8081) that is reachable inside the compose network only, and
# has Prometheus scrape it there. Nothing of this is published to the host except Grafana.
#
# Set GRAFANA_ADMIN_PASSWORD before the first start; there is no default.

services:
  qnop:
    environment:
      QNOP_MANAGEMENT_PORT: '8081'

  prometheus:
    image: prom/prometheus:v3.7.3
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - qnop

  grafana:
    image: grafana/grafana:12.2.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
    ports:
      - '${GRAFANA_PORT:-3000}:3000'
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
