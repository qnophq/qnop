# SPDX-License-Identifier: AGPL-3.0-only
#
# Compose stack for the public demo instance (demo.qnop.io, issue #710):
# the deployer stack from ../docker-compose.yml plus Caddy as the
# TLS-terminating reverse proxy. The app is only reachable through Caddy;
# the demo data is restored from ./golden by reset-demo.sh every 12 hours.
#
# All variables come from /opt/qnop-demo/.env (created by install.sh).

name: qnop-demo

services:
  caddy:
    image: caddy:2@sha256:ce773ec7a742ce15ee6bf2bb5f65882b9e2a4487b10733e6f1484f86e6b5d8bc
    ports:
      - '80:80'
      - '443:443'
    environment:
      QNOP_DEMO_DOMAIN: ${QNOP_DEMO_DOMAIN:?e.g. demo.qnop.io}
      QNOP_DEMO_ACME_EMAIL: ${QNOP_DEMO_ACME_EMAIL:?contact e-mail for Let's Encrypt}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - qnop_caddy_data:/data
      - qnop_caddy_config:/config
    restart: unless-stopped

  qnop:
    # Pinned by digest (issue #925) — Renovate bumps tag + digest via PR, and
    # reset-demo.sh rolls the reviewed pin out from main. A moving `latest`
    # would deploy whatever the registry serves, unreviewed, within 12 h.
    image: docker.io/qnophq/qnop-ce:1.3.0@sha256:7297f98ae36f9a9916d36a3b61ffc7a15f23bbf453843d311a48c21f7266ade4
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      QNOP_DB_HOST: postgres
      QNOP_DB_PORT: 5432
      QNOP_DB_NAME: ${QNOP_DB_NAME:-qnop}
      QNOP_DB_USERNAME: ${QNOP_DB_USERNAME:-qnop}
      QNOP_DB_PASSWORD: ${QNOP_DB_PASSWORD:?set a real database password}
      QNOP_S3_ENDPOINT: http://minio:9000
      QNOP_S3_BUCKET: ${QNOP_S3_BUCKET:-qnop-documents}
      QNOP_S3_ACCESS_KEY: ${QNOP_S3_ACCESS_KEY:?set a real object-storage access key}
      QNOP_S3_SECRET_KEY: ${QNOP_S3_SECRET_KEY:?set a real object-storage secret key}
      QNOP_S3_PATH_STYLE_ACCESS: 'true'
      QNOP_S3_AUTO_CREATE_BUCKET: 'true'
      QNOP_AUTH_JWT_SECRET: ${QNOP_AUTH_JWT_SECRET:?generate with `openssl rand -base64 48`}
      QNOP_AUTH_ENCRYPTION_KEY: ${QNOP_AUTH_ENCRYPTION_KEY:?generate with `openssl rand -base64 48`}
      QNOP_AUTH_ENCRYPTION_SALT: ${QNOP_AUTH_ENCRYPTION_SALT:?generate with `openssl rand -hex 32`}
      # Caddy terminates TLS in front of the app.
      QNOP_HTTP_FORWARD_HEADERS_STRATEGY: framework
      # Trust X-Forwarded-For only from the pinned compose network below —
      # i.e. from the on-host Caddy. Without this qnop discards the header
      # (ADR-0027's secure default), every visitor resolves to Caddy's
      # container address, rate limits collapse into one shared bucket and
      # usage tracking geolocates everyone to the instance (issue #731).
      QNOP_AUTH_RATELIMIT_TRUSTEDPROXYCIDRS: 172.28.0.0/16
    healthcheck:
      # bash, not CMD-SHELL: the image's /bin/sh is dash, which has no /dev/tcp (#870).
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf "GET /actuator/health HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3 && head -1 <&3 | grep -q 200']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  postgres:
    image: postgres:18@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    environment:
      POSTGRES_USER: ${QNOP_DB_USERNAME:-qnop}
      POSTGRES_PASSWORD: ${QNOP_DB_PASSWORD:?set a real database password}
      POSTGRES_DB: ${QNOP_DB_NAME:-qnop}
    volumes:
      # postgres:18+ stores data under /var/lib/postgresql/<major>/docker —
      # mount the parent, not the legacy …/data path.
      - qnop_pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${QNOP_DB_USERNAME:-qnop} -d ${QNOP_DB_NAME:-qnop}']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: cgr.dev/chainguard/minio:latest@sha256:db3f583fa49121942168bd6383a773b2cde3384c9a99bf7193560b9a0f3a28fd
    user: '0:0' # keep volumes from the former root-run MinIO image writable
    command: server /data
    environment:
      MINIO_ROOT_USER: ${QNOP_S3_ACCESS_KEY:?set a real object-storage access key}
      MINIO_ROOT_PASSWORD: ${QNOP_S3_SECRET_KEY:?set a real object-storage secret key}
    volumes:
      - qnop_miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # One-shot MinIO client used by reset-demo.sh / build-golden-state.sh:
  #   docker compose --profile tools run --rm mc <command…>
  # Reuses the server image: it ships `mc` plus a shell, unlike the shell-less
  # cgr.dev/chainguard/minio-client. Root so it can write the ./golden bind mount.
  mc:
    user: '0:0'
    image: cgr.dev/chainguard/minio:latest@sha256:db3f583fa49121942168bd6383a773b2cde3384c9a99bf7193560b9a0f3a28fd
    profiles: ['tools']
    entrypoint: ['/bin/sh', '-c']
    environment:
      QNOP_S3_ACCESS_KEY: ${QNOP_S3_ACCESS_KEY}
      QNOP_S3_SECRET_KEY: ${QNOP_S3_SECRET_KEY}
      QNOP_S3_BUCKET: ${QNOP_S3_BUCKET:-qnop-documents}
    volumes:
      - ./golden:/golden

volumes:
  qnop_caddy_data:
  qnop_caddy_config:
  qnop_pgdata:
  qnop_miniodata:

networks:
  # Pinned so QNOP_AUTH_RATELIMIT_TRUSTEDPROXYCIDRS above can name the
  # exact range Caddy's egress lives in.
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16
